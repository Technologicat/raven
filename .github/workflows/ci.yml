name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check . --ignore SIM103

      - name: Lint advisories (non-blocking)
        run: ruff check . --select SIM103 || true

  test:
    needs: lint
    # A hung test step otherwise runs to GitHub's default of six hours, and reads as "still running" the
    # whole time — which is indistinguishable from a slow queue until someone goes and looks. The suite
    # takes about three minutes on every runner, so twenty is a long way past slow and a long way short of
    # a wasted afternoon. (Live case 2026-08-21: a Windows job sat in `Run tests` for a quarter of an hour
    # while the other three had long since passed.)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Full Python matrix on Linux; newest supported Python only on macOS
        # and Windows.  Raven's Python range is currently capped at <3.13 by
        # kokoro/misaki (TTS stack) — see `CLAUDE.md` → "Why the 3.12 upper
        # cap" for the rationale and the plan to lift the cap.  Once that
        # cap lifts, add 3.13/3.14 to the Linux matrix and bump the mac/
        # Windows includes to the new newest version.
        #
        # The test job installs dependencies hand-picked via pip + `-e .
        # --no-deps` rather than pulling raven's full dep set (which would
        # include kokoro/misaki and is heavy), so expanding to mac/Windows
        # does not risk resolver explosions — we only install the subset
        # the test suite actually needs.  The torch CPU wheel index
        # (download.pytorch.org/whl/cpu) has Linux/macOS/Windows wheels,
        # so the torch install line works unchanged on every OS.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI test dependencies
        # The list is pinned and shared with coverage.yml — see requirements-ci.txt for why both.
        # The torch trio is pinned here rather than there: it comes from PyTorch's own CPU wheel
        # index, and an --index-url inside the requirements file would apply to all of it.
        #
        # Keep these three at the versions `pyproject.toml` pins. They drifted once — CI ran torch
        # 2.13.0 against a project pinning 2.11.0, because Dependabot cannot see pins written inline
        # here and the manual bump touched only this file. A CI that tests undeclared versions can go
        # green on a combination no user will ever install, which is the opposite of its job.
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements-ci.txt
          pip install torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps

      - name: Run tests
        run: pytest raven/ -v --tb=short -m "not ml"
