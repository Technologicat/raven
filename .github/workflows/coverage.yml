name: Coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CI test dependencies
        # The same pinned list ci.yml installs — see requirements-ci.txt for why it is hand-picked
        # rather than `pdm install`, why it is pinned, and why it is one file rather than two.
        # The torch trio is pinned here rather than there: it comes from PyTorch's own CPU wheel
        # index, and an --index-url inside the requirements file would apply to all of it. Keep the
        # three at the versions `pyproject.toml` pins, and in step with ci.yml — see the longer note
        # there for the drift this prevents.
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements-ci.txt
          pip install torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps

      - name: Run tests with coverage
        run: pytest raven/ -v --tb=short -m "not ml" --cov=raven --cov-branch --cov-report=xml:coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
