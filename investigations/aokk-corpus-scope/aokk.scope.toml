# The AOKK corpus's definition for `raven-scopebib`: the prototype in this directory, written in the tool's
# format, and revised for the scope the team set on 2026-11-03: `README.md` → *The scope, as the team revised it*.
# The tests and hints began as `judge_scope.py`'s rubric, minus what the tool's own frame says for any corpus (silence
# keeps, a generic title gives no evidence, use the venue, judge the work rather than the phrase).

scope = "studies of AI agents as students' interactive learning partners, in vocational and higher education institutions"

hints = """
A phrase can match in a sense the search did not mean, and this is the main thing to look for. "Learning
assistant" names an AI tool, and it is ALSO the established term in STEM education research for a HUMAN
undergraduate who helps teach a course - that second sense has no AI in it and is "no_ai" true.
"Conversational agent" and "intelligent agent" appear in fields with nothing to do with education.

"Teaching", "training" and "learning" have the same problem, and it is the one most likely to mislead you
here, because those words are ALSO how the machine-learning field describes training a model. A "teachable
agent" that crowdworkers correct, a system "trained" on a dataset, a paper about "learning" a policy - the
learner there is a model, and this search is about human learners. That is NOT an educational dimension here.
The words count as education for this search only when a HUMAN is the one learning.

A venue rarely says the LEVEL - an education journal covers schools and universities alike - so it is weak
evidence for "wrong_level".
"""

# ---- The judge. For each record it answers every test true or false, with one confidence for the record
# and a sentence saying why; only a true at high confidence drops a record.

[[test]]
name = "no_ai"
asks = """
true ONLY if the work is positively about something with no artificial intelligence in it - human teaching
staff, human tutors, human undergraduate learning assistants, or a non-AI technology. False when AI is
present in any way (an AI agent, assistant, chatbot, tutor or LLM-based tool, or AI in general - including
its use, its effects, attitudes towards it, policy and ethics about it, and AI literacy), AND false when the
work does not say what it used: a record that does not say what method it used is NOT "no_ai"; answer false
and lower your confidence.
"""

[[test]]
name = "not_education"
asks = """
answered in two steps, in this order. FIRST: can you name what this work is about, from what you were given?
If you cannot - the title is generic, an editorial or a section heading, or a proper noun or acronym you do
not recognize - then answer false with low confidence, and stop. SECOND, only if you can name the subject:
is that subject entirely outside education? Answer true only for a subject you can name that plainly
involves no teaching, learning, students or courses - a machine-learning methods paper, a computer-vision or
natural-language-processing study, a finance, engineering, energy or medical application. Teaching,
learning, students, courses, curricula, training and education policy all count as an educational
dimension, at ANY level. Here, unlike the other tests, absence is evidence: a study about education says so,
so a survey of machine-learning techniques that never mentions a learner is "not_education" true, however
much AI is in it.
"""

[[test]]
name = "wrong_level"
asks = """
true ONLY if the work is positively set outside vocational and higher education institutions - preschool,
primary or secondary school, K-12, workplace or professional training outside an educational institution, or
informal learning by the general public, even where some of those learners happen to be students. False when
the setting is a university, college, polytechnic or vocational school, or a course or work placement of
theirs, AND false when the work does not say what level it is set at: these records all matched a
higher-education search term already, so a record that does not say its level is NOT "wrong_level"; answer
false and lower your confidence.
"""

[[test]]
name = "teachers_as_learners"
asks = """
true ONLY if the people learning in the work are teachers: practising teachers, their professional
development, or student teachers in teacher education. False when teachers appear only as those who teach,
or as one group among several learners, AND false when the work does not say who is learning.
"""

[[test]]
name = "learner_agent"
fires_on = false
asks = """
false ONLY if the work positively has no AI that learners use or interact with: AI is the subject of the
teaching, as in AI literacy; the work is about policy, ethics or institutions; AI serves only teachers or
administrators; or the agent does not exist yet, as in a needs assessment or a proposal for a future system.
True for any system a learner uses, whatever the authors call it and however simple, including adaptive
tutors; true for a study of learners' perceptions of one; true for a review of such systems; AND true when the
work does not say.
"""

# ---- The extractor: what a kept record says. Every vocabulary also has `not_stated`.

[[field]]
name = "population"
asks = "who the work studies"
[field.values]
university_students = "students in higher education"
vocational_students = "students in vocational education"
school_pupils = "pupils in primary or secondary school"
preservice_teachers = "people studying to become teachers"
inservice_teachers = "practising teachers"
researchers = "researchers, as the subjects of the work"
professionals = "practitioners in a profession other than teaching"
general_public = "the public at large"
mixed = "students together with others, such as practitioners or the public"
none = "the work studies no human population - a method, a system, a dataset"

[[field]]
name = "level"
asks = """
the educational level the work is set at. The distinction between these is the SETTING, not the subject
matter or the age of the learner. A course taught to university students is "higher_education" however
professional its subject; medicine, law and teacher preparation are degree study. People training for a
profession are "higher_education" or "vocational" when the work names their programme, and not_stated when it
names none: "trainees" alone does not make them practitioners. A review, survey or
meta-analysis has no setting of its own: give it the level its own scope names, and answer not_stated when
it names none, which is the common case. Many studies never say their level; answer not_stated rather than
inferring it from the topic, the venue or what would be usual.
"""
# Every level a record states is quoted; "not_applicable" asserts an absence, which has no words to quote.
quote = ["higher_education", "school", "vocational", "professional_training", "informal", "mixed"]
[field.values]
higher_education = "a university, college, polytechnic or their students and faculty - degree study"
school = "primary or secondary schooling, K-12, pupils"
vocational = "formal vocational or trade education leading to a qualification"
professional_training = """
workplace and professional development: practitioners already qualified, being coached, upskilled or trained
on the job. Teacher CPD, staff onboarding
"""
informal = """
learning outside any institution - self-directed learners, the general public, lifelong learning, patient
or rehabilitation training, museum and hobby settings. It is about the absence of an institution, not the
absence of a stated year: undergraduates whose year is never given are higher_education
"""
mixed = "the work spans more than one of these levels"
not_applicable = """
the work is not set in education at all - a methods paper, a recommender, a clinical tool. If somebody is
learning something, the work IS set in education and another value applies
"""

[[field]]
name = "human_learning"
asks = """
whether a HUMAN is taught or is learning in this work, as against a model being trained. "Teaching",
"training" and "learning" are also the machine-learning field's words for training a model: a "teachable
agent" corrected by crowdworkers, a system "trained" on a corpus, a paper about "learning" a control policy -
in all of those the learner is a model.
"""
[field.values]
yes = "a human is taught or is learning"
no = "no human is taught or learning: the learner is a model"

# ---- Tags: questions the team decides on the whole set at once. No rule reads these, so they remove nothing.

[[field]]
name = "study_kind"
asks = "what kind of work this is"
[field.values]
empirical = "reports data collected from people: an experiment, a user study, a survey, interviews, a case study"
computational = "no participants: a benchmark, a simulation, or an analysis of existing data or logs"
theoretical = "a theory, model or framework, argued or derived"
review = "a literature review, systematic review or meta-analysis"
position = "an argument, opinion or essay"
design_proposal = "proposes or describes a system or an intervention, with no evaluation of it"
other = "none of these"

[[field]]
name = "agent_kind"
asks = "how the AI and the learner interact, whatever the authors call it"
[field.values]
conversational = "they exchange messages or speech: a chatbot, a virtual patient, a conversational tutor"
feedback = "it responds to what the learner does, without conversation: hints, corrections, assessment"
adaptive = "it selects or sequences material by the learner's performance"
generative_tool = "the learner asks it to produce something, with no sustained exchange"
other = "they interact in some other way"
none = "no AI that learners use"

[[field]]
name = "focus"
asks = "what the work actually examines about the AI and its learners"
[field.values]
learning = "learners using it: the learning process or its outcomes"
perceptions = "only attitudes, perceptions, acceptance or intention to use"
system = "the system itself: its design, or an evaluation of how well it works"
other = "something else"

[[field]]
name = "ai_role"
asks = "what the AI does in this work, or 'none' if there is no AI in it"
max_words = 8

# ---- The rules. First match wins.

[[rule]]
label = "school level, stated in the text"
when = { level = ["school"] }
action = "remove"

[[rule]]
label = "the learners are teachers"
when = { population = ["inservice_teachers", "preservice_teachers"] }
action = "remove"

[[rule]]
label = "not about education: no educational level, and no one learning"
when = { level = ["not_applicable"], human_learning = ["no"] }
action = "remove"

[[rule]]
label = "possibly not about education: no educational level, but someone may be learning"
when = { level = ["not_applicable"] }
action = "hold"

[[rule]]
label = "learning outside an institution, e.g. workplace training"
when = { level = ["professional_training", "informal"] }
action = "hold"
