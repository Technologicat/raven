[project]
name = "raven-visualizer"
description = "Semantic visualizer and analyzer"
authors = [
    { name = "Juha Jeronen and JAMK University of Applied Sciences", email = "juha.jeronen@jamk.fi" },
]
requires-python = "<3.13,>=3.11"  # kokoro (TTS) and misaki cap at <3.13; mcpyrate/unpythonic support 3.10–3.15

readme = "README.md"

# Raven is 2-clause BSD by default, but not uniformly, and the metadata has to say so — this is what
# packagers and tooling read. `AND` is the SPDX operator for "a consumer must satisfy all of these", which is
# what a distribution containing all of them requires.
#
#   AGPL-3.0-only        all of `raven.server`, and `raven.avatar.pose_editor`. From SillyTavern-extras,
#                        whose licence they preserve. `-only` because "or any later version" is a permission
#                        holders must grant explicitly and none of them did — not upstream, not here — and
#                        Raven could not grant it anyway, not being the sole copyright holder.
#   LGPL-3.0-or-later    `raven.common.gui.xdotwidget`, derived from xdottir and through it from Jose
#                        Fonseca's `xdot.py`, whose header grants the "or later" outright. Same method as
#                        the AGPL above, opposite answer, because the upstream grants differ.
#   MIT                  `raven.common.video.upscaler`, matching the Anime4K engine it ports.
#   Apache-2.0           `raven.vendor.kokoro_fastapi`.
#
# Vendored code's licences are shipped rather than folded into the expression above, following `pip` — the
# canonical heavy-vendoring project, which declares its own MIT and globs the rest. The wrinkle is that
# Raven's `vendor/` is *adopted* rather than pristine, so Raven-authored code lives under those licences too;
# Apache-2.0 is in the expression for that reason. See `raven/vendor/README.md`.
license = "BSD-2-Clause AND AGPL-3.0-only AND MIT AND Apache-2.0 AND LGPL-3.0-or-later"

# Listed rather than globbed, because a glob cannot express the one exclusion needed: the THA3 weights
# directory is downloaded, gitignored and excluded from the build below, but it contains a `LICENSE.txt` at
# the same depth as the vendored packages' own, so `raven/**/LICENSE*` resolved it into the metadata while
# the build left the file out — PKG-INFO then pointed at something the sdist did not contain.
#
# The cost is that this list goes stale when something new is vendored. That is close to a feature: adding a
# vendored dependency is exactly the moment to think about its licence, and a missing entry here is a
# cheaper reminder than the alternative.
license-files = ["LICENSE.md",
                 "raven/fonts/LICENSE.md",
                 "raven/fonts/OFL.txt",
                 "raven/server/LICENSE",
                 "raven/avatar/pose_editor/LICENSE",
                 "raven/common/gui/xdotwidget/LICENSE",
                 "raven/common/gui/xdotwidget/LICENSE_colorbrewer_color_schemes",
                 "raven/vendor/anime4k/LICENSE",
                 "raven/vendor/DearPyGui_Markdown/LICENSE",
                 "raven/vendor/file_dialog/LICENSE",
                 "raven/vendor/kokoro_fastapi/LICENSE",
                 "raven/vendor/tha3/LICENSE.txt"]

# Tell whichever build backend is in use (pdm in our case) to run its own mechanism
# to find the version of the project and plug it into the metadata.
# Details for how we instruct pdm to find the version are in `[tool.pdm.version]` below.
dynamic = ["version"]

dependencies = [
    "bibtexparser>=2.0.0b9",
    "dearpygui>=2.3.1",  # non-Latin text needs `add_font_range` before 2.3, which builds font atlas ranges automatically; we no longer call it
    "filelock>=3.32.3",  # librarian: keeping two frontends off one chat datastore. Already in the tree via torch and huggingface_hub; declared because we import it.
    "mcpyrate>=4.3.0",  # we only use the colorizer utility for now
    "mistletoe>=1.6.0",  # vendored dpg-markdown
    "numpy>=2.4.6",
    "openTSNE>=1.0.4",  # BibTeX importer: dimension reduction from high-D to 2D
    "pip==24.3.1",  # spaCy language model auto-install  # TODO: which pip version?
    "psutil>=7.2.2",  # vendored file_dialog
    "scikit-learn>=1.9.0",  # BibTeX importer: high-dimensional clustering (HDBSCAN)
    "scipy>=1.17.1",  # visualizer: KDTree
    "sentence_transformers>=6.0.0",  # BibTeX importer: vector embeddings for visualization and semantic search. Also many of the server's AI modules use this.
    "spacy>=3.8.15",  # BibTeX importer: NLP analysis
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",  # spaCy
    "sseclient-py>=1.9.0",  # librarian: streaming transport for receiving data from LLM
    # The torch trio is version-pinned (not floored) and sourced from the `pytorch-cu128` index declared under
    # `[[tool.pdm.source]]` below — so a re-lock keeps the validated `+cu128` build set instead of drifting the
    # versions (and, worse, the audio wheel's CUDA runtime) on its own. Bump these three together, deliberately.
    "torch==2.11.0",
    "torchvision==0.26.0",  # raven.common.video
    "torchaudio==2.11.0",  # raven.common.audio.resample (device-agnostic resampler)
    "unpythonic>=2.4.0",  # `si_prefix(always_separate=...)`, used by `raven.common.filelisting`, arrived in 2.3.0
    "wordcloud>=1.9.6",  # visualizer
    "wosfile>=0.7.0",  # wos2bib
    "chromadb>=1.5.9",  # RAG semantic search
    "bm25s>=0.3.10",  # RAG keyword search
    "watchdog>=6.0.0",  # RAG document directory monitoring
    "selenium>=4.47.0",  # server.websearch
    "colorama>=0.4.6",  # server (though we use it also through `mcpyrate` elsewhere)
    "markdown>=3.10.3",  # server (for rendering readme/docs)
    "flask>=3.1.3",  # server
    "flask-cors>=6.0.5",  # server
    "flask-compress>=1.24",  # server
    "huggingface-hub>=1.28.0",  # server (AI models autodownloader)
    "waitress>=3.0.2",  # server
    "kokoro>=0.9.4",  # server.tts; you may also need the `espeak-ng` software; on Linux, `sudo apt install espeak-ng`. For Windows, see instructions at https://github.com/hexgrad/kokoro
    "av>=18.1.0",  # TTS audio encoder (for network transport)
    "pygame>=2.6.1",  # TTS audio playback (client side)
    "qoi>=0.7.2",  # server, fast lossless image format for streaming
    # raven.common.image.codec, client.avatar_renderer, server.modules.avatar, librarian.imagestore. Already in
    # the tree via torchvision and wordcloud; declared because we import it. The floor is the version CI pins
    # and the tree resolves, rather than a feature we need — nothing here uses a recent Pillow API.
    "Pillow>=12.3.0",
    "dehyphen>=0.3.4",  # server, `sanitize` module
    "sentencepiece>=0.2.2",  # server, `translate` module, needed by some transformers models
    "sacremoses>=0.2.0",  # server, `translate` module, needed by some transformers models
    "strip-markdown>=1.3",  # TTS
    "emoji>=2.15.0",  # TTS, emoji stripping
    "accelerate>=1.14.0",  # faster loading of `whisper-large-v3-turbo`, according to model card
    "pvrecorder>=1.2.7",
    # The ceiling is about the *system* library, which pip cannot see: PyTurboJPEG 2.0 moved to the
    # function-based TurboJPEG 3 API and needs libjpeg-turbo 3.0+, while distributions this decade still
    # ship 2.x (Mint 21.3: libturbojpeg 2.1.2). Upstream's own advice is to stay on 1.x until the C
    # library is new enough. What 2.x adds is 12- and 16-bit JPEG, which nothing here wants.
    "PyTurboJPEG>=1.8.3,<2",
    "feedparser>=6.0.14",  # papers: arXiv search
    "requests>=2.34.2",  # client, librarian, papers (arXiv tools)
    "tqdm>=4.70.0",  # server.stt, papers (arXiv download)
    "trafilatura>=2.2.0",  # readability extraction (HTML -> clean text/markdown): server.webfetch for fetched pages, raven.common.docextract for saved ones. `html2txt`, which docextract needs to tell a truncated extraction from a clean one, arrived in 2.1
    "youtube-transcript-api>=1.2.4",  # server.webfetch; transcript extraction for YouTube URLs
    "pypdf>=6.16.1",  # raven.common.docextract: PDF text layer
    # The rest of `raven.common.docextract`'s backends. Office formats are all zipped XML, but each family needs
    # its own reader; `odfpy` covers both OpenDocument formats we accept. `python-docx` needs at least 1.1 for
    # `iter_inner_content`, which walks a body's paragraphs and tables in document order — without it, table
    # text can only be appended after the prose, which scrambles the reading order a chunker depends on.
    "python-docx>=1.2.0",  # .docx
    "python-pptx>=1.0.2",  # .pptx
    "odfpy>=1.4.1",  # .odt, .odp
]

keywords=["visualization", "semantic-analysis", "application", "AI", "NLP", "GUI"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Operating System :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities"
]

# For CUDA, we need some `nvidia-*` pip packages from NVIDIA:
#   https://docs.nvidia.com/cuda/cuda-installation-guide-linux/index.html#pip-wheels
# with the appropriate cuda version; see the output of your `nvidia-smi`.
# This is currently configured for CUDA 12.x.
#
# The NVIDIA packages will be installed into `.venv/lib/python3.10/site-packages/nvidia*`.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Coverage instrumentation, used by .github/workflows/coverage.yml.
    # NOTE: raven's CI workflows deliberately do NOT use `pdm install` —
    # the full dependency tree pulls in torch/torchvision (multi-GB) and
    # the Python-version-pinned kokoro/misaki stack, neither of which the
    # test suite needs. Workflows install a hand-picked dep subset via
    # `pip install` directly. `pytest-cov` is declared here anyway so a
    # local `pdm install` for development matches what CI exercises.
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    # The Emacs integration tools, deliberately unbounded: none of them has any bearing on what Raven
    # does, so any version anyone happens to have is the right one.
    "flake8",
    "autopep8",
    "importmagic",
    "epc",
    "jedi>=0.20.0",
    # For local pre-release sanity checks: `python -m build --sdist`
    # exercises the same sdist path that CI runs on tag push.
    "build>=1.5.0",
    # For validating .github/workflows/*.yml during local dev (not used at runtime).
    "pyyaml>=6.0.3",
    # Sampling profiler that attaches to an already-running process, for the
    # "is this hung or is it working?" question a batch job raises once it goes
    # quiet. Needs ptrace permission: `sudo sysctl -w kernel.yama.ptrace_scope=0`,
    # or run it under sudo.
    #
    # NOTE: `pdm add` rewrites this table and drops every comment in it. Add
    # dependencies here by hand, or restore the comments afterwards.
    "py-spy>=0.4.2",
]

[project.optional-dependencies]
cuda = [
    "cupy-cuda12x>=13.2.0",
    "nvidia-cuda-nvcc-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "tensorrt>=8.5.2.2",  # for NVIDIA acceleration; should pull in the relevant package
]

[project.urls]
Repository = "https://github.com/Technologicat/raven"

[project.scripts]
# Entries marked `# GUI` map a window as soon as their module is imported — the DPG setup runs at module
# level, not inside `main()`. So **do not iterate this table and import each target** to smoke-test that the
# entry points still load: that launches seven applications on the developer's desktop, and each one takes
# keyboard focus from whatever they were typing into. (Done once, 2026-08-10, while checking an unrelated
# refactor; the pose editor came up before anyone could stop it.)
#
# A safe import check covers the unmarked entries only, and `raven-server` wants excluding from that too:
# importing it loads ML models onto the GPU, and *running* it never returns — it serves until someone hits
# Ctrl+C, so a script that launches it to see whether it starts will simply hang there.
#
# Where a real check of the GUI apps is wanted, run one under `pytest --run-gui` — and warn first; see
# CLAUDE.md, "Live GUI testing on a shared desktop".
raven-check-cuda = "raven.tools.check_cuda:main"
raven-check-audio-devices = "raven.tools.check_audio_devices:main"
raven-arxiv2id = "raven.papers.identifiers:main"
raven-arxiv2bib = "raven.papers.arxiv2bib:main"  # arXiv IDs -> BibTeX, completes the raven-arxiv2id path
raven-arxiv-download = "raven.papers.download:main"
raven-arxiv-search = "raven.papers.search:main"
raven-burstbib = "raven.papers.burstbib:main"
raven-fixbib = "raven.papers.fixbib:main"
raven-dehyphenate = "raven.tools.dehyphenate:main"
raven-csv2bib = "raven.papers.csv2bib:main"
raven-pdf2bib = "raven.papers.pdf2bib:main"
raven-qoi2png = "raven.tools.qoi2png:main"
raven-wos2bib = "raven.papers.wos2bib:main"
raven-indexer = "raven.librarian.indexer:main"  # build/refresh Librarian's RAG index headlessly
raven-minichat = "raven.librarian.minichat:main"
raven-librarian = "raven.librarian.app:main"  # GUI
raven-server = "raven.server.app:main"
raven-avatar-pose-editor = "raven.avatar.pose_editor.app:main"  # GUI - AI avatar pose editor
raven-avatar-settings-editor = "raven.avatar.settings_editor.app:main"  # GUI - AI avatar postprocessor config editor / character tester
raven-importer = "raven.visualizer.importer_cli:main"
raven-visualizer = "raven.visualizer.app:main"  # GUI - the main app!
raven-xdot-viewer = "raven.xdot_viewer.app:main"  # GUI - xdot graph viewer
raven-cherrypick = "raven.cherrypick.app:main"  # GUI - image triage tool
raven-conference-timer = "raven.conference_timer.app:main"  # GUI - countdown timer for talks

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
# The `file` source tells pdm to look for a line in a file that matches the regex `__version__ = ".*"`.
# The regex parse is fairly robust, it can handle arbitrary whitespace and comments.
source = "file"
path = "raven/__init__.py"

[tool.pdm.build]
includes = ["raven"]
# The THA3 weights are downloaded at first use into a gitignored directory, and the sdist build does not
# consult `.gitignore` — so without this exclusion `includes = ["raven"]` swept in 860 MB of `.pt` files and
# a HuggingFace download cache, producing an sdist PyPI would reject on its per-file size limit alone.
# It never reached anyone, which is why it went unnoticed: Raven is unpublished *on PyPI*, and its GitHub
# releases are tag-only — those source tarballs are `git archive`, which contains tracked files only, so the
# gitignored weights were never in them. Building an sdist by hand was the first time it showed.
# Measured 2026-08-03: 903 MB across 582 files before, 107 MB across 537 after.
#
# `00_workfiles` directories hold the sources the shipped art was exported *from* — GIMP `.xcf`, Inkscape
# `.svg`, camera originals, intermediate crops. They belong in the repository, where someone redrawing an
# icon or a character needs them, and not in a wheel, where nothing can open them and no code looks for
# them. Measured 2026-08-12: 95 files that compress to 92.8 MB, taking the wheel from 107 MB to 14.4 MB —
# so the 107 MB left over from the exclusion above was almost entirely this.
excludes = ["**/tests", "**/__pycache__", "raven/vendor/tha3/models", "**/00_workfiles"]

[[tool.pdm.source]]
name = "nvidia"
url = "https://pypi.org/simple"
verify_ssl = true

# PyTorch CUDA 12.8 wheels. `include_packages` makes this source *exclusive* for the torch trio, so a re-lock
# resolves the `+cu128` builds from here instead of PyPI's default wheels — which now bundle CUDA 13 and fail to
# load against a CUDA 12.x runtime (`libcudart.so.13: cannot open shared object file`). Without this, a bare
# `torchaudio>=2.4.0` floor lets `pdm lock` silently drift the audio wheel onto the CUDA-13 PyPI build while
# torch/torchvision stay `+cu128`, and the mismatched runtime breaks at import. Bump the `cuXYZ` in the URL to
# move the whole stack to a different CUDA version.
[[tool.pdm.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
verify_ssl = true
include_packages = ["torch", "torchvision", "torchaudio"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Use the modern importlib-based import mode so that multiple `tests/` packages
# (e.g. `raven/common/tests/`, `raven/common/audio/tests/`, `raven/common/video/tests/`)
# don't collide under pytest's default `prepend` mode.
#   https://docs.pytest.org/en/stable/explanation/pythonpath.html#import-modes
addopts = "--import-mode=importlib"
markers = [
    "ml: tests that require the full ML stack (spaCy, Flair, torch models). Skipped on CI; run locally by default.",
    "gui: tests that map a real GUI window, and so take keyboard focus while they run. Skipped unless --run-gui is passed; see conftest.py.",
]

[tool.coverage.run]
# Coverage signal is about which lines of *production code* run.
# pytest already reports pass/fail per test, so coverage of the test
# files themselves would just add rows without insight. The omit glob
# uses `*/tests/*` (plural) to catch all the scattered `tests/` dirs
# under raven/<subpkg>/tests/. Under `raven/vendor` we omit exactly what
# ruff excludes, and for the same reason: code we carry as upstream
# shipped it. `file_dialog` and `DearPyGui_Markdown` are our forks, so
# their coverage is our signal and they are measured with the rest.
source = ["raven"]
omit = [
    "*/tests/*",
    "*/vendor/tha3/*",
    "*/vendor/kokoro_fastapi/*",
    "*/vendor/anime4k/*",
    "*/vendor/IconsFontAwesome6.py",
]

[tool.ruff]
line-length = 130
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    # Only the parts of `raven/vendor` we do not develop. `file_dialog` and `DearPyGui_Markdown` are our
    # forks — substantially extended here, and carrying our own tests — so they are linted like the rest of
    # the tree. The three below are as upstream shipped them, give or take a performance tune in `tha3`
    # (`no_grad` -> `inference_mode`), a provenance comment in `kokoro_fastapi` and docstrings in `anime4k`;
    # linting them would report on somebody else's style. `IconsFontAwesome6.py` is a generated table.
    "raven/vendor/tha3",
    "raven/vendor/kokoro_fastapi",
    "raven/vendor/anime4k",
    "raven/vendor/IconsFontAwesome6.py",
    "briefs",
]

[tool.ruff.lint]
select = ["E", "W", "F", "SIM"]
ignore = [
    # pycodestyle
    "E203",   # whitespace before ':' — needed for slice alignment
    "E265",   # block comment should start with '# ' — commented-out code, markers
    "E301",   # expected 1 blank line — blank lines are semantic paragraph breaks
    "E302",   # expected 2 blank lines before def — same
    "E305",   # expected 2 blank lines after end — same
    "E306",   # expected blank line before nested def — same
    "E402",   # module level import not at top — conditional/deferred imports
    "E501",   # line too long — advisory, not enforced
    "E731",   # lambda assignment — closures are idiomatic in this codebase
    # flake8-simplify
    "SIM102",  # collapsible if — nested ifs often represent distinct semantic guards
    "SIM105",  # contextlib.suppress — try/except/pass is more flexible and explicit
    "SIM108",  # ternary instead of if/else — often less readable, no real gain
    "SIM117",  # combine with statements — nesting shows parent/child (DPG); also mcpyrate AST differences
    "SIM118",  # in-dict-keys — explicit .keys() marks the variable as a dictlike
    "SIM300",  # yoda conditions — H > threshold reads naturally, threshold < H does not
    "SIM910",  # dict.get with None default — explicit None documents programmer intent
    # Note: SIM103 (return condition directly) is intentionally NOT ignored here.
    # It is enabled as an advisory — CI runs it in a non-failing second pass.
    "SIM114",  # combine if branches — match-casing style keeps branches separate; autofix would damage semantics
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # re-exports via star-import

[tool.mypy]
show_error_codes = true
